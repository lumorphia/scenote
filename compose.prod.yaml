# 本番 (ADR-0025、docs/runbook/deploy.md)。lumorphia/accounts の compose.prod.yaml と同じ形。
# web・worker・migrate は同じイメージ (ADR-0024)。80/443 は lumorphia/edge の Caddy が受け、
# 共有のネットワーク lumorphia-edge の scenote-web:3200 へ流す。ホストにポートを出さない
name: scenote
x-app: &app
  image: ghcr.io/lumorphia/scenote-app:${SCENOTE_TAG:-latest}
  env_file: ${SCENOTE_ENV_FILE:-.env.production}
  environment:
    NODE_ENV: production
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks: [backend]
  stop_grace_period: 35s

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: scenote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: scenote
    volumes: [pgdata:/var/lib/postgresql]
    networks: [backend]
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, pg_isready -U scenote -d scenote]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *app
    working_dir: /repo
    command: [node, packages/db/src/migrate.ts]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  web:
    <<: *app
    networks:
      backend:
      edge:
        aliases: [scenote-web]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3200/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped
  # 派生画像・画像の判定・画像の移動と削除・掃除・地名の同期・記録の削除。判定器のモデルを読むのでメモリを使う
  worker:
    <<: *app
    command: [node, --import, ./server/sentry.ts, ./server/worker.ts]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  backup:
    image: ghcr.io/lumorphia/scenote-backup:${SCENOTE_TAG:-latest}
    env_file: ${SCENOTE_BACKUP_ENV_FILE:-.env.backup}
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging
    restart: unless-stopped

networks:
  backend:
  edge:
    external: true
    name: lumorphia-edge
volumes:
  pgdata:
