packages:
  - apps/*
  - packages/*

# 公開から 1 日経っていない版を入れない (pnpm 12 の既定の minimumReleaseAge。lumorphia/prismtone の ADR-0033 と同じ)。
# ここで緩めない。手元で確かめるだけなら pnpm_config_minimum_release_age=0 を付ける

# 例外: 自分たちの lumorphia/platform が CI で公開するもので、公開してすぐに使う (lumorphia/prismtone の ADR-0036)
minimumReleaseAgeExclude:
  - "@lumorphia/*"

# 依存の版の固定。脆弱性やバンドルの都合で、間接依存の版を上書きする (lumorphia/prismtone・editor と同じ)
overrides:
  "@huggingface/transformers>sharp": ^0.35.5

# 依存のビルドスクリプト (install / postinstall) を走らせるかを 1 つずつ決める。載っていないものは install が失敗する
allowBuilds:
  # ネイティブのバイナリを置く。vite / react-router のビルドで使う
  esbuild: true
  # 以下は transformers.js (現像の切り抜き) の Node 向けの依存。現像はブラウザで動くので使わない (lumorphia/editor と同じ)
  # CUDA のバイナリ (330 MB) を取りに行くだけ。CPU 用はパッケージに入っているので要らない
  onnxruntime-node: false
  # 同梱の CLI の版を確かめるだけ
  protobufjs: false
  # 画像のネイティブのバイナリ
  sharp: false
