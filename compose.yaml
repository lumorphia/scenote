# 開発用。本番の compose は本番の段 (docs/plan.md) で作る。prismtone (5433)・accounts (5434) の開発用とぶつからないよう 5435 を使う
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: scenote
      POSTGRES_PASSWORD: scenote
      POSTGRES_DB: scenote
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenote -d scenote"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 開発の https (docker/Caddyfile.dev)。https://scenote.lumorphia.test:8445 を、手元の開発サーバー (3200) へ流す。
  # 手元の 127.0.0.1:3200 に届くよう host のネットワークで動かす
  caddy:
    image: caddy:2.11.6
    network_mode: host
    volumes:
      - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./.data/tls:/certs:ro
    restart: unless-stopped

volumes:
  pgdata:
