name: ci

# 検査は PR でだけ回す。develop / main への push (= マージ) では、PR で確かめた中身を回し直さない。
# public リポジトリなので Actions の時間は org の上限を使わない (ADR-0007)。E2E も PR ごとに回す。
# main への push では release-please だけを回す。イメージの公開は本番の段で足す (ADR-0008)
on:
  pull_request:
  push:
    branches: [main]

# 同じ PR への連続 push で古い run を取り消す。main では release-please を途中で止めない
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # @lumorphia/* (lumorphia/platform) を GitHub Packages から読む
  packages: read

env:
  DATABASE_URL: postgres://scenote:scenote@127.0.0.1:5432/scenote

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: scenote
          POSTGRES_PASSWORD: scenote
          POSTGRES_DB: scenote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scenote -d scenote"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@lumorphia"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:migrate
      # CI=true なので、DATABASE_URL が無いと DB テストは skip ではなく失敗する (packages/db/src/require-database.ts)
      - run: pnpm test:coverage
      - run: pnpm build

  # https の scenote.lumorphia.test で回す (ADR-0008)。証明書は手元と同じスクリプトで作る
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: scenote
          POSTGRES_PASSWORD: scenote
          POSTGRES_DB: scenote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scenote -d scenote"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@lumorphia"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm dev:certs
      # Chromium 本体は Playwright の版でキャッシュし、OS のライブラリだけ毎回入れる
      - id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # シークレットの混入と高リスクの脆弱性。lumorphia/platform の再利用ワークフロー (platform ADR-0009)。
  # 版 (アクション・gitleaks・Node) は platform で上げ、ここの固定は Renovate が上げる
  security:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: lumorphia/platform/.github/workflows/security.yml@f09c5000438dc7f4a9184b1a0e1717ff852c8b51 # main
    with:
      github-packages: true

  # main に積まれた Conventional Commits から release-please がリリース PR (package.json の version と
  # CHANGELOG.md) を開き直す。そのリリース PR をマージした push でリリース (vX.Y.Z のタグと GitHub Release) ができる
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # GITHUB_TOKEN が開いた PR では ci が走らない (Actions の再帰防止)。リリース PR は version と CHANGELOG だけ
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
